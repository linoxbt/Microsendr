services:
  db:
    # Pin by digest when deploying: docker pull postgres:17-alpine && docker inspect --format '{{index .RepoDigests 0}}'
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kora_public
      POSTGRES_PASSWORD: ${KORA_PUBLIC_DB_PASSWORD:?Set KORA_PUBLIC_DB_PASSWORD in .env.public}
      POSTGRES_DB: kora_public
    volumes:
      - kora-public-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora_public -d kora_public"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: kora-api:latest
    build: .
    restart: unless-stopped
    env_file: .env.public
    environment:
      DATABASE_URL: postgres://kora_public:${KORA_PUBLIC_DB_PASSWORD}@db:5432/kora_public
      HOST: 0.0.0.0
      PORT: 4312
      KORA_MODE: sandbox
    init: true
    ports:
      - "127.0.0.1:4312:4312"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node --import tsx packages/database/src/migrate.ts && exec node --import tsx services/api/src/index.ts"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4312/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: kora-api:latest
    restart: unless-stopped
    env_file: .env.public
    environment:
      DATABASE_URL: postgres://kora_public:${KORA_PUBLIC_DB_PASSWORD}@db:5432/kora_public
      KORA_MODE: sandbox
    init: true
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "--import", "tsx", "services/worker/src/index.ts"]
    healthcheck:
      # The worker records a heartbeat file each loop pass; stale means it is wedged.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-heartbeat');if(Date.now()-s.mtimeMs>120000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    # Pin by digest when deploying, as for the database image.
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - kora-public-caddy-data:/data
      - kora-public-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  kora-public-postgres:
  kora-public-caddy-data:
  kora-public-caddy-config:
