services:
  postgres:
    image: postgres:17-alpine
    # Fixed name so `pnpm backup:drill` finds the container by default.
    container_name: kora-postgres
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora_local_only
      POSTGRES_DB: kora
    volumes:
      - kora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora -d kora"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  kora-postgres:
