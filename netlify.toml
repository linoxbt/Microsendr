# Production pages are served here, not by the API, so the security headers live here too.
# Keep the CSP in step with contentSecurityPolicy in services/api/src/app.ts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://js.hcaptcha.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://auth.privy.io https://*.hcaptcha.com; font-src 'self'; connect-src 'self' https://auth.privy.io https://api.privy.io https://challenges.cloudflare.com https://*.hcaptcha.com https://verification.didit.me https://rpc1mainnet.qie.digital; frame-src https://auth.privy.io https://challenges.cloudflare.com https://*.hcaptcha.com https://verify.didit.me; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self \"https://verify.didit.me\"), microphone=(), geolocation=()"
