name: Roots CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  financial-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora_ci_only
          POSTGRES_DB: kora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kora -d kora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kora:kora_ci_only@127.0.0.1:5432/kora
      KORA_MODE: sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm sandbox:init
      - run: pnpm db:migrate
      - run: pnpm contract:check
      - run: pnpm build
      - run: pnpm check
      - run: pnpm smoke:phase1
      - run: pnpm smoke:phase7
      - run: pnpm smoke:phase6
      - run: pnpm smoke:phase5
      - run: pnpm backup:drill
        env:
          KORA_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm smoke:phase3
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/

  # Builds the production image and boots it the way production runs it:
  # migrations, the API (health and web app) and one worker pass, as a non-root user.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: docker build -t roots:ci .
      - name: Boot image against PostgreSQL
        run: |
          set -eu
          docker network create roots
          docker run -d --name db --network roots -e POSTGRES_USER=kora \
            -e POSTGRES_PASSWORD=kora_ci_only -e POSTGRES_DB=kora postgres:17-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U kora -d kora && break; sleep 1; done
          env="--network roots -e DATABASE_URL=postgres://kora:kora_ci_only@db:5432/kora -e KORA_MODE=sandbox -e KORA_CONSOLE_ORIGINS=https://ci.example"
          docker run --rm $env roots:ci node --import tsx packages/database/src/migrate.ts
          docker run -d --name api $env -e HOST=0.0.0.0 -e PORT=4312 -p 4312:4312 roots:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4312/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:4312/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:4312/ | grep -q '<div id="root">'
          test "$(docker exec api id -u)" != "0"
          docker run --rm $env roots:ci node --import tsx services/worker/src/index.ts --once
      - name: Container logs on failure
        if: failure()
        run: docker logs api || true
