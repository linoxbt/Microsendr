name: Microsendr CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  financial-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora_ci_only
          POSTGRES_DB: kora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kora -d kora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kora:kora_ci_only@127.0.0.1:5432/kora
      KORA_MODE: sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm sandbox:init
      - run: pnpm db:migrate
      - run: pnpm contract:check
      - run: pnpm build
      - run: pnpm check
      - run: pnpm smoke:phase1
      - run: pnpm smoke:phase7
      - run: pnpm smoke:phase6
      - run: pnpm smoke:phase5
      - run: pnpm backup:drill
        env:
          KORA_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm smoke:phase3
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
